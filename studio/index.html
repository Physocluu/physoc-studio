<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhySoc Studio</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* ---- PhySoc design tokens (so template var(--…) resolve) ---- */
:root{
  --ink:#07140E; --ink-alt:#0A0810; --lime:#BFF36A; --leaf:#8BC34A; --mint:#5AD1A0; --forest:#2E7D32;
  --paper:#FAFAFA; --paper-2:#F5F5F5; --forest-deep:#0F3322; --forest-mid:#1C5A39; --teal-deep:#0E5A48;
  --surface:var(--paper); --surface-sunk:var(--paper-2); --text-strong:var(--ink); --text-body:#223027; --text-muted:#6F8B7A;
  --accent:var(--forest); --accent-cta:var(--lime); --on-accent-cta:var(--ink); --hairline:rgba(7,20,14,0.12);
  --wordmark:var(--leaf); --wordmark-2:var(--forest); --wordmark-dot:var(--lime);
  --tag-social:var(--lime); --tag-talk:var(--mint); --tag-workshop:var(--leaf); --tag-careers:var(--forest);
  --font-display:"Space Grotesk","Arial Narrow",sans-serif; --font-body:"Baloo 2","Trebuchet MS",sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --fs-mono-xs:0.6875rem; --fs-mono-sm:0.8125rem; --fs-body-sm:0.9375rem; --fs-body:1.0625rem; --fs-body-lg:1.375rem;
  --fs-h4:1.75rem; --fs-h3:2.5rem; --fs-h2:3.5rem; --fs-h1:5rem; --fs-display:7rem;
  --tracking-label:0.22em; --tracking-tight:-0.02em; --tracking-wide:0.06em;
  --radius-sm:6px; --radius-md:12px; --radius-lg:20px; --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(7,20,14,0.06); --shadow-md:0 6px 20px rgba(7,20,14,0.10);
  --glass-bg:rgba(250,250,250,0.62); --glass-border:rgba(255,255,255,0.75); --glass-hi:rgba(255,255,255,0.55); --glass-shadow:0 20px 60px rgba(7,20,14,0.14); --glass-blur:22px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
}
[data-register="dark"]{
  --surface:var(--ink); --surface-sunk:var(--ink-alt); --text-strong:var(--paper); --text-body:#C8D6CC; --text-muted:#7FA18C;
  --accent:var(--lime); --accent-cta:var(--lime); --on-accent-cta:var(--ink); --hairline:rgba(191,243,106,0.24);
  --wordmark:var(--lime); --wordmark-2:var(--mint); --wordmark-dot:var(--mint);
  --glass-bg:rgba(20,42,32,0.45); --glass-border:rgba(191,243,106,0.22); --glass-hi:rgba(191,243,106,0.14); --glass-shadow:0 20px 60px rgba(0,0,0,0.35);
}
/* ---- app chrome ---- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0f1115;color:#e8ece9;font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid #1e232b;background:#12151b;flex:0 0 auto}
.topbar .mark{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:20px;letter-spacing:-0.01em}
.topbar .mark .wm{white-space:nowrap}
.topbar .mark .dot{color:#BFF36A}
.topbar .mark .studio{color:#BFF36A;font-weight:700}
.topbar .sub{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#6d7a72}
.topbar .spacer{flex:1}
.btn{border:1px solid #2a313b;background:#1a1f27;color:#e8ece9;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
.btn:hover{background:#222834;border-color:#3a434f}
.btn.primary{background:#BFF36A;color:#0A140C;border-color:#BFF36A}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn:focus-visible,.card:focus-visible,[data-photo]:focus-visible{outline:3px solid #BFF36A;outline-offset:3px}
.btn:disabled{cursor:not-allowed;opacity:.45}
/* gallery */
#gallery{flex:1;overflow:auto;padding:26px 30px 60px}
.intro{max-width:760px;margin:4px 0 26px}
.intro h1{font-size:26px;margin:0 0 8px;letter-spacing:-0.01em}
.intro p{margin:0;color:#9aa7a0;font-size:15px;line-height:1.5}
.grp-title{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#7f8c84;margin:26px 0 14px;padding-bottom:8px;border-bottom:1px solid #1c212a}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.card{width:100%;padding:0;text-align:left;color:inherit;font:inherit;background:#161a21;border:1px solid #232a33;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:#3a4552;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.thumb{position:relative;width:100%;background:#0b0d11;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb .frame{position:absolute;top:0;left:0;transform-origin:top left;pointer-events:none}
.card .meta{padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .meta .nm{font-size:13.5px;font-weight:600}
.card .meta .dim{font-family:"IBM Plex Mono",monospace;font-size:10px;color:#6d7a72;letter-spacing:0.06em}
/* editor */
#editor{flex:1;display:none;overflow:hidden}
#editor.on{display:flex}
.stagewrap{flex:1;background:#0b0d11;background-image:radial-gradient(#1a1f27 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:34px}
#stageScaler{transform-origin:top left;position:relative}
#stageScaler [data-field]{outline:1px dashed transparent;transition:outline-color .12s;border-radius:3px}
#stageScaler [data-field]:hover{outline-color:rgba(191,243,106,.55)}
#stageScaler [data-field]:focus{outline:2px solid #BFF36A;outline-offset:1px}
#stageScaler .has-overflow{outline:4px solid #ff8a8a !important;outline-offset:2px}
#stageScaler [data-photo]{cursor:grab}
#stageScaler [data-photo].empty{cursor:pointer}
#stageScaler [data-photo].dragging{cursor:grabbing}
.photo-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;color:var(--text-muted);font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:repeating-linear-gradient(45deg,rgba(127,127,127,.06),rgba(127,127,127,.06) 10px,transparent 10px,transparent 20px)}
.photo-ph svg{opacity:.5}
/* panel */
.panel{width:340px;flex:0 0 340px;background:#12151b;border-left:1px solid #1e232b;display:flex;flex-direction:column;overflow:hidden}
.panel .phead{padding:16px 18px;border-bottom:1px solid #1e232b;display:flex;align-items:center;gap:10px}
.panel .phead .t{font-weight:700;font-size:16px}
.panel .phead .d{font-family:"IBM Plex Mono",monospace;font-size:10px;color:#6d7a72;letter-spacing:.08em}
.draft-state{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;color:#BFF36A;letter-spacing:.08em;text-transform:uppercase}
.panel .body{flex:1;overflow:auto;padding:6px 18px 24px}
.panel .foot{flex:0 0 auto;padding:14px 18px;border-top:1px solid #1e232b;display:flex;gap:10px}
.sec{margin-top:20px}
.sec-h{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7f8c84;margin:0 0 10px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:#9aa7a0;margin-bottom:4px;font-weight:600}
.fld input[type=text],.fld textarea,.fld select{width:100%;background:#0e1116;border:1px solid #2a313b;color:#e8ece9;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;resize:vertical}
.fld textarea{min-height:56px;line-height:1.35}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:#BFF36A}
.photocard{border:1px solid #242b34;border-radius:10px;padding:12px;margin-bottom:12px;background:#0e1116}
.photocard .row{display:flex;gap:8px;align-items:center}
.photocard .hint{font-size:11px;color:#7f8c84;margin-top:8px}
.rng{width:100%;accent-color:#BFF36A;margin-top:6px}
.mini{font-size:11px;color:#6d7a72}
.emptybadge{font-family:"IBM Plex Mono",monospace;font-size:10px;color:#0A140C;background:#BFF36A;border-radius:999px;padding:2px 8px;letter-spacing:.08em}
.issues{display:none;margin:14px 18px 0;padding:10px 12px;border:1px solid rgba(255,138,138,.55);border-radius:8px;background:rgba(255,138,138,.08);color:#ffc4c4;font-size:12px;line-height:1.4}
.issues.on{display:block}
.exporting [data-field]{outline:none !important}
.exporting [data-photo]{cursor:default !important}
.exporting *{-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1f27;border:1px solid #3a434f;color:#e8ece9;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media (max-width:760px){
  #app{height:auto;min-height:100vh;overflow:visible}
  .topbar{position:sticky;top:0;z-index:20;padding:10px 12px;gap:8px;flex-wrap:wrap}
  .topbar .sub{display:none}
  .btn{padding:8px 12px}
  #gallery{padding:18px 14px 44px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #editor.on{display:flex;flex-direction:column;overflow:visible}
  .stagewrap{min-height:52vh;height:52vh;flex:0 0 52vh;padding:18px;overflow:hidden}
  .panel{width:100%;flex:0 0 auto;max-height:none;border-left:0;border-top:1px solid #1e232b}
  .panel .body{max-height:none;overflow:visible}
  .panel .foot{position:sticky;bottom:0;z-index:10;background:#12151b}
}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important;transition:none !important}}
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
<rect width="240" height="160" fill="#0f1115"/>
<g transform="translate(84,44)">
<ellipse cx="36" cy="36" rx="36" ry="15" transform="rotate(0 36 36)" fill="none" stroke="#BFF36A" stroke-width="3"/>
<ellipse cx="36" cy="36" rx="36" ry="15" transform="rotate(60 36 36)" fill="none" stroke="#8BC34A" stroke-width="3"/>
<ellipse cx="36" cy="36" rx="36" ry="15" transform="rotate(120 36 36)" fill="none" stroke="#5AD1A0" stroke-width="3"/>
<circle cx="36" cy="36" r="7" fill="#BFF36A"/>
</g>
<text x="120" y="140" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="22" fill="#e8ece9">PhySoc<tspan fill="#BFF36A">.</tspan></text>
</svg>
</template>
<div id="app">
  <div class="topbar">
    <div class="mark"><span class="wm">PhySoc<span class="dot">.</span></span><span class="studio">Studio</span></div>
    <div class="spacer"></div>
    <button type="button" class="btn ghost" id="backBtn" style="display:none">← All templates</button>
    <button type="button" class="btn primary" id="dlBtn" style="display:none">Download PNG</button>
  </div>

  <div id="gallery">
    <div class="intro">
      <h1>Pick a template</h1>
    </div>
    <div id="groups"></div>
  </div>

  <div id="editor">
    <div class="stagewrap"><div id="stageScaler"></div></div>
    <div class="panel">
      <div class="phead"><div><div class="t" id="pName">Template</div><div class="d" id="pDim"></div></div><span class="draft-state" id="draftState" aria-live="polite"></span></div>
      <div class="issues" id="issues" role="status" aria-live="polite"></div>
      <div class="body" id="pBody"></div>
      <div class="foot">
        <button type="button" class="btn ghost" id="resetBtn" style="flex:0 0 auto">Reset</button>
        <button type="button" class="btn primary" id="dlBtn2" style="flex:1;justify-content:center">Download PNG</button>
      </div>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>
<script src="templates-data.js"></script>
<script src="announcement-template.js"></script>
<script src="engine.js"></script>
</body>
</html>
