document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"23f47cde-4c2a-4078-a539-bef7dea34f82\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"7efb465a-e5dc-48f9-851f-e38849fd7b1e\"><\u002Fscript>\n<style>\n/* ---- PhySoc design tokens (so template var(--…) resolve) ---- */\n:root{\n  --ink:#07140E; --ink-alt:#0A0810; --lime:#BFF36A; --leaf:#8BC34A; --mint:#5AD1A0; --forest:#2E7D32;\n  --paper:#FAFAFA; --paper-2:#F5F5F5; --forest-deep:#0F3322; --forest-mid:#1C5A39; --teal-deep:#0E5A48;\n  --surface:var(--paper); --surface-sunk:var(--paper-2); --text-strong:var(--ink); --text-body:#223027; --text-muted:#6F8B7A;\n  --accent:var(--forest); --accent-cta:var(--lime); --on-accent-cta:var(--ink); --hairline:rgba(7,20,14,0.12);\n  --wordmark:var(--leaf); --wordmark-2:var(--forest); --wordmark-dot:var(--lime);\n  --tag-social:var(--lime); --tag-talk:var(--mint); --tag-workshop:var(--leaf); --tag-careers:var(--forest);\n  --font-display:\"Space Grotesk\",\"Arial Narrow\",sans-serif; --font-body:\"Baloo 2\",\"Trebuchet MS\",sans-serif; --font-mono:\"IBM Plex Mono\",ui-monospace,monospace;\n  --fs-mono-xs:0.6875rem; --fs-mono-sm:0.8125rem; --fs-body-sm:0.9375rem; --fs-body:1.0625rem; --fs-body-lg:1.375rem;\n  --fs-h4:1.75rem; --fs-h3:2.5rem; --fs-h2:3.5rem; --fs-h1:5rem; --fs-display:7rem;\n  --tracking-label:0.22em; --tracking-tight:-0.02em; --tracking-wide:0.06em;\n  --radius-sm:6px; --radius-md:12px; --radius-lg:20px; --radius-pill:999px;\n  --shadow-sm:0 1px 2px rgba(7,20,14,0.06); --shadow-md:0 6px 20px rgba(7,20,14,0.10);\n  --glass-bg:rgba(250,250,250,0.62); --glass-border:rgba(255,255,255,0.75); --glass-hi:rgba(255,255,255,0.55); --glass-shadow:0 20px 60px rgba(7,20,14,0.14); --glass-blur:22px;\n  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;\n}\n[data-register=\"dark\"]{\n  --surface:var(--ink); --surface-sunk:var(--ink-alt); --text-strong:var(--paper); --text-body:#C8D6CC; --text-muted:#7FA18C;\n  --accent:var(--lime); --accent-cta:var(--lime); --on-accent-cta:var(--ink); --hairline:rgba(191,243,106,0.24);\n  --wordmark:var(--lime); --wordmark-2:var(--mint); --wordmark-dot:var(--mint);\n  --glass-bg:rgba(20,42,32,0.45); --glass-border:rgba(191,243,106,0.22); --glass-hi:rgba(191,243,106,0.14); --glass-shadow:0 20px 60px rgba(0,0,0,0.35);\n}\n/* ---- app chrome ---- */\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:#0f1115;color:#e8ece9;font-family:\"Space Grotesk\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}\nbutton{font-family:inherit}\n#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}\n.topbar{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid #1e232b;background:#12151b;flex:0 0 auto}\n.topbar .mark{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:20px;letter-spacing:-0.01em}\n.topbar .mark .wm{white-space:nowrap}\n.topbar .mark .dot{color:#BFF36A}\n.topbar .mark .studio{color:#BFF36A;font-weight:700}\n.topbar .sub{font-family:\"IBM Plex Mono\",monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#6d7a72}\n.topbar .spacer{flex:1}\n.btn{border:1px solid #2a313b;background:#1a1f27;color:#e8ece9;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}\n.btn:hover{background:#222834;border-color:#3a434f}\n.btn.primary{background:#BFF36A;color:#0A140C;border-color:#BFF36A}\n.btn.primary:hover{filter:brightness(1.05)}\n.btn.ghost{background:transparent}\n/* gallery */\n#gallery{flex:1;overflow:auto;padding:26px 30px 60px}\n.intro{max-width:760px;margin:4px 0 26px}\n.intro h1{font-size:26px;margin:0 0 8px;letter-spacing:-0.01em}\n.intro p{margin:0;color:#9aa7a0;font-size:15px;line-height:1.5}\n.grp-title{font-family:\"IBM Plex Mono\",monospace;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#7f8c84;margin:26px 0 14px;padding-bottom:8px;border-bottom:1px solid #1c212a}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}\n.card{background:#161a21;border:1px solid #232a33;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}\n.card:hover{transform:translateY(-3px);border-color:#3a4552;box-shadow:0 12px 30px rgba(0,0,0,.35)}\n.thumb{position:relative;width:100%;background:#0b0d11;overflow:hidden;display:flex;align-items:center;justify-content:center}\n.thumb .frame{position:absolute;top:0;left:0;transform-origin:top left;pointer-events:none}\n.card .meta{padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px}\n.card .meta .nm{font-size:13.5px;font-weight:600}\n.card .meta .dim{font-family:\"IBM Plex Mono\",monospace;font-size:10px;color:#6d7a72;letter-spacing:0.06em}\n/* editor */\n#editor{flex:1;display:none;overflow:hidden}\n#editor.on{display:flex}\n.stagewrap{flex:1;background:#0b0d11;background-image:radial-gradient(#1a1f27 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:34px}\n#stageScaler{transform-origin:top left;position:relative}\n#stageScaler [data-field]{outline:1px dashed transparent;transition:outline-color .12s;border-radius:3px}\n#stageScaler [data-field]:hover{outline-color:rgba(191,243,106,.55)}\n#stageScaler [data-field]:focus{outline:2px solid #BFF36A;outline-offset:1px}\n#stageScaler [data-photo]{cursor:grab}\n#stageScaler [data-photo].empty{cursor:pointer}\n#stageScaler [data-photo].dragging{cursor:grabbing}\n.photo-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;color:var(--text-muted);font-family:\"IBM Plex Mono\",monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:repeating-linear-gradient(45deg,rgba(127,127,127,.06),rgba(127,127,127,.06) 10px,transparent 10px,transparent 20px)}\n.photo-ph svg{opacity:.5}\n/* panel */\n.panel{width:340px;flex:0 0 340px;background:#12151b;border-left:1px solid #1e232b;display:flex;flex-direction:column;overflow:hidden}\n.panel .phead{padding:16px 18px;border-bottom:1px solid #1e232b;display:flex;align-items:center;gap:10px}\n.panel .phead .t{font-weight:700;font-size:16px}\n.panel .phead .d{font-family:\"IBM Plex Mono\",monospace;font-size:10px;color:#6d7a72;letter-spacing:.08em}\n.panel .body{flex:1;overflow:auto;padding:6px 18px 24px}\n.panel .foot{flex:0 0 auto;padding:14px 18px;border-top:1px solid #1e232b;display:flex;gap:10px}\n.sec{margin-top:20px}\n.sec-h{font-family:\"IBM Plex Mono\",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7f8c84;margin:0 0 10px}\n.fld{margin-bottom:12px}\n.fld label{display:block;font-size:11.5px;color:#9aa7a0;margin-bottom:4px;font-weight:600}\n.fld input[type=text],.fld textarea,.fld select{width:100%;background:#0e1116;border:1px solid #2a313b;color:#e8ece9;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;resize:vertical}\n.fld textarea{min-height:56px;line-height:1.35}\n.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:#BFF36A}\n.photocard{border:1px solid #242b34;border-radius:10px;padding:12px;margin-bottom:12px;background:#0e1116}\n.photocard .row{display:flex;gap:8px;align-items:center}\n.photocard .hint{font-size:11px;color:#7f8c84;margin-top:8px}\n.rng{width:100%;accent-color:#BFF36A;margin-top:6px}\n.mini{font-size:11px;color:#6d7a72}\n.emptybadge{font-family:\"IBM Plex Mono\",monospace;font-size:10px;color:#0A140C;background:#BFF36A;border-radius:999px;padding:2px 8px;letter-spacing:.08em}\n.exporting [data-field]{outline:none !important}\n.exporting [data-photo]{cursor:default !important}\n.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1f27;border:1px solid #3a434f;color:#e8ece9;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}\n.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"app\">\n  <div class=\"topbar\">\n    <div class=\"mark\"><span class=\"wm\">PhySoc<span class=\"dot\">.<\u002Fspan><\u002Fspan><span class=\"studio\">Studio<\u002Fspan><\u002Fdiv>\n    <div class=\"spacer\"><\u002Fdiv>\n    <button class=\"btn ghost\" id=\"backBtn\" style=\"display:none\">← All templates<\u002Fbutton>\n    <button class=\"btn primary\" id=\"dlBtn\" style=\"display:none\">Download PNG<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div id=\"gallery\">\n    <div class=\"intro\">\n      <h1>Pick a template<\u002Fh1>\n    <\u002Fdiv>\n    <div id=\"groups\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"editor\">\n    <div class=\"stagewrap\"><div id=\"stageScaler\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"panel\">\n      <div class=\"phead\"><div><div class=\"t\" id=\"pName\">Template<\u002Fdiv><div class=\"d\" id=\"pDim\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"body\" id=\"pBody\"><\u002Fdiv>\n      <div class=\"foot\">\n        <button class=\"btn ghost\" id=\"resetBtn\" style=\"flex:0 0 auto\">Reset<\u002Fbutton>\n        <button class=\"btn primary\" id=\"dlBtn2\" style=\"flex:1;justify-content:center\">Download PNG<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<input type=\"file\" id=\"fileInput\" accept=\"image/*\" style=\"display:none\">\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n<script src=\"dbdfa01e-cdbf-4cb8-ad41-4db67f885484\"><\u002Fscript>\n<script src=\"a4458910-c919-4d17-ad0c-dfcb9f06f71a\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
